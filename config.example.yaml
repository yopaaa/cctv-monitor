  #   alarm:
  #     method: "http_get"
  #     on_url: "http://192.168.1.101/cgi-bin/hi3510/param.cgi?cmd=setalarmsoundattr&-alarm_mode=1"
  #     off_url: "http://192.168.1.101/cgi-bin/hi3510/param.cgi?cmd=setalarmsoundattr&-alarm_mode=0"
