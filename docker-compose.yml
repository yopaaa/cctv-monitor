services:
  cctv-monitor:
    build: .
    image: llabbs/cctv-monitor:latest
    container_name: cctv-monitor
    restart: unless-stopped
    # Akses root untuk menulis & membaca rekaman ke storage host
    user: "0:0"
    volumes:
      # Mount config (read-write agar bisa simpan pengaturan dari web)
      - ./config.yaml:/app/config.yaml
      # Mount folder storage rekaman (read-write untuk built-in NVR & deteksi gerakan)
      - /mnt/nvr_storage:/app/recordings
    environment:
      # Path folder rekaman di dalam container
      - RECORDINGS_DIR=/app/recordings
    # Agar container bisa akses kamera di jaringan lokal
    network_mode: host
