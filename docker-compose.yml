services:
  cctv-monitor:
    image: llabbs/cctv-monitor:latest
    container_name: cctv-monitor
    restart: unless-stopped
    # Akses root untuk membaca volume rekaman host NVR (aman karena volume di-mount :ro)
    user: "0:0"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Mount folder storage rekaman Shinobi di host (read-only agar aman)
      - /mnt/nvr_storage:/app/recordings:ro
    environment:
      # Path folder rekaman di dalam container
      - RECORDINGS_DIR=/app/recordings
    # Agar container bisa akses kamera di jaringan lokal
    network_mode: host
